franka_wrench_extractor:
  ros__parameters:
    publish_hz: 100.0

openmv_cam:
  ros__parameters:
    port: "/dev/openmvcam"
    baud: 115200
    publish_fps: 30.0
    topic: "/openmv_cam/image"
    publish_3_channel_img: true
    topic_3_channel: "/openmv_cam/event_frame_3ch"

record_manager:
  ros__parameters:
    record_raw_events: false
    bag_storage: "mcap"
    bag_shutdown_timeout_sec: 180.0
    allow_force_kill_bag: false
    bag_sigterm_timeout_sec: 30.0
    bag_sigkill_timeout_sec: 10.0

teleop_dashboard:
  ros__parameters:
    overlay_hdf5_path: "/home/jau/dyros/src/fr3_teleop/assets/pih_ref_ofrgb.jpg"
    selected_event_frame_visualization: "mono"

spacemouse_publisher:
  ros__parameters:
    enable_buttons: true
    button_topic_name: "/spacemouse_buttons"
    hidraw_vendor_id: "256f"
    hidraw_product_id: "c635"

ps4_input_manager:
  ros__parameters:
    button_gripper_open: 2
    button_gripper_close: 0
    axis_episode: 6
    button_home: 1
    axis_teleop: 7
    button_trajectory_phase_test: 3

    interception_arm_button: 4

    left_stick_x_idx: 0
    left_stick_y_idx: 1
    right_stick_y_idx: 4

    enable_spacemouse_buttons: true
    spacemouse_button_gripper_open: 0
    spacemouse_button_gripper_close: 1

