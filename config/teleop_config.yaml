gripper_manager:
  ros__parameters:
    gripper_move_action_name: "/right_franka_gripper/move"
    gripper_grasp_action_name: "/right_franka_gripper/grasp"


    use_grasp_for_close: true

    gripper_speed: 0.1
    gripper_open_width: 0.080
    gripper_close_width: 0.048
    gripper_command_epsilon: 0.001
    min_command_interval_sec: 0.5
    move_close_assumed_done_sec: 0.75

    gripper_grasp_width: 0.0
    gripper_grasp_force: 30.0
    gripper_grasp_epsilon_inner: 0.08
    gripper_grasp_epsilon_outer: 0.08
    command_epsilon: 0.002

    allow_gripper_without_teleop: false
    enable_deprecated_width_topic: false