shared_topics:
  ros__parameters:
    episode_control: "/episode/control"
    camera_info: "/camera/camera/color/camera_info"
    twist_cmd: "/cartesian_cmd/twist"
    gripper_state_command: "/teleop/gripper_state_cmd"
    gripper_command: "/teleop/gripper_cmd"
    rgb_image: "/camera/camera/color/image_raw"
    openmv_mono: "/openmv_cam/image"
    openmv_3ch: "/openmv_cam/event_frame_3ch"
    joint_states: "/joint_states"
    teleop_control: "/teleop/control"

shared_services:
  ros__parameters:
    start_recording: "/record_manager/start_recording"
    stop_recording: "/record_manager/stop_recording"
    set_debug_bypass: "/record_manager/set_debug_bypass_topic_presence"

openmv_cam:
  ros__parameters:
    port: "/dev/openmvcam"
    baud: 115200
    publish_fps: 30.0
    topic: "/openmv_cam/image"
    publish_3_channel_img: true
    topic_3_channel: "/openmv_cam/event_frame_3ch"

record_manager:
  ros__parameters:
    topics_to_record:
      - "/episode/control"
      - "/camera/camera/color/camera_info"
      - "/cartesian_cmd/twist"
      - "/teleop/gripper_state_cmd"
      - "/camera/camera/color/image_raw"
      - "/openmv_cam/image"
      - "/openmv_cam/event_frame_3ch"
      - "/joint_states"

teleop_dashboard:
  ros__parameters:
    overlay_hdf5_path: "/home/jau/dyros/src/fr3_teleop/assets/pih_ref_ofe.jpg"
    event_frame_mono_topic: "/openmv_cam/image"
    event_frame_3ch_topic: "/openmv_cam/event_frame_3ch"
    episode_control_topic: "/episode/control"
    teleop_control_topic: "/teleop/control"

    start_recording_service: "/record_manager/start_recording"
    stop_recording_service: "/record_manager/stop_recording"
    set_debug_bypass_service: "/record_manager/set_debug_bypass_topic_presence"

    start_event_frames_service: "/openmv_cam/start_event_frame_publishing"
    stop_event_frames_service: "/openmv_cam/stop_event_frame_publishing"
    start_raw_event_recording_service: "/openmv_cam/start_raw_event_recording"
    stop_raw_event_recording_service: "/openmv_cam/stop_raw_event_recording"

spacemouse_publisher:
  ros__parameters:
    enable_buttons: true
    button_topic_name: "/spacemouse_buttons"
    hidraw_vendor_id: "256f"
    hidraw_product_id: "c635"

ps4_input_manager:
  ros__parameters:
    button_gripper_open: 2
    button_gripper_close: 0
    axis_episode: 6
    button_home: 1
    axis_teleop: 7

    left_stick_x_idx: 0
    left_stick_y_idx: 1
    right_stick_y_idx: 4

    spacemouse_topic_name: "/spacemouse_cmd"

    enable_spacemouse_buttons: true
    spacemouse_button_topic_name: "/spacemouse_buttons"
    spacemouse_button_gripper_open: 0
    spacemouse_button_gripper_close: 1

    deadzone: 0.08
    ps4_override_hold_ms: 300

    max_vx: 0.08
    max_vy: 0.08
    max_vz: 0.05

    spacemouse_deadzone: 0.0
    spacemouse_timeout_ms: 80
    spacemouse_max_vx: 0.045
    spacemouse_max_vy: 0.045
    spacemouse_max_vz: 0.035

    spacemouse_max_wx: 0.64
    spacemouse_max_wy: 0.64
    spacemouse_max_wz: 0.64


    spacemouse_enable_rotation: true

    translation_sensitivity: 2.5
    rotation_sensitivity: 5.0

    haptic_pos_multiplier: 2.0
    haptic_lin_vel_multiplier: 1.0
    haptic_ori_multiplier: 1.0
    haptic_ang_vel_multiplier: 1.0

    twist_topic_name: "/cartesian_cmd/twist"
    twist_frame_id: "base_link"

    teleop_control_topic: "/teleop/control"
    teleop_action_name: "/cartesian_executor"
    teleop_mode: 0
    teleop_ee_name: "right_fr3_hand_tcp"
    teleop_move_orientation: true

    gripper_state_command_topic: "/teleop/gripper_state_cmd"

    home_action_name: "/fr3_move_to_joint"

    home_joint_names:
      - "right_fr3_joint1"
      - "right_fr3_joint2"
      - "right_fr3_joint3"
      - "right_fr3_joint4"
      - "right_fr3_joint5"
      - "right_fr3_joint6"
      - "right_fr3_joint7"

    home_joint_positions:
      - -0.11307370077073517 # 1
      - -0.5780235358715815 # 2
      - -0.125515130419747 # 3
      - -2.6345995844121566 # 4
      - -0.07698932141065598 #5
      - 2.07024652434962 # 6
      - 0.5979843918116214 # 7
      
      # for peg-in-hole, good rgb view      
      # - -0.00  # right_fr3_joint1
      # - -0.8423077682863201      # right_fr3_joint2
      # - 0.00   # right_fr3_joint3
      # - -2.7754953819074073      # right_fr3_joint4
      # - 0.0    # right_fr3_joint5
      # - 1.9440275651964238       # right_fr3_joint6
      # - 0.7853981634       # right_fr3_joint7




      # for ball into ring
      # - -0.00
      # - -0.17894121136367586
      # - 0.0
      # - -2.7817434397297225
      # - 0.00
      # - 2.62409615716241
      # - 0.7714418627146631

    home_vel_scale: 0.1
    home_acc_scale: 0.1

gripper_manager:
  ros__parameters:
    gripper_state_command_topic: "/teleop/gripper_state_cmd"
    gripper_command_topic: "/teleop/gripper_cmd"
    gripper_inhibit_topic: "/teleop/gripper_inhibit"
    teleop_control_topic: "/teleop/control"
    gripper_move_action_name: "/right_franka_gripper/move"
    gripper_grasp_action_name: "/right_franka_gripper/grasp"


    use_grasp_for_close: true

    gripper_speed: 0.1
    gripper_open_width: 0.080
    gripper_close_width: 0.048
    gripper_command_epsilon: 0.001
    min_command_interval_sec: 0.5
    move_close_assumed_done_sec: 0.75

    gripper_grasp_width: 0.0
    gripper_grasp_force: 30.0
    gripper_grasp_epsilon_inner: 0.08
    gripper_grasp_epsilon_outer: 0.08
    command_epsilon: 0.002

    allow_gripper_without_teleop: false
    enable_deprecated_width_topic: false